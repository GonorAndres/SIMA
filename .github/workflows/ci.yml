name: CI

# Branch model:
#   dev  -- push directly, no PR needed. CI runs on every push.
#   main -- PR only, and only from dev (see the source-branch job below).
#
# `pull_request: [main, dev]` matters: previously only PRs into main ran CI, so
# work merged into dev arrived untested and every failure surfaced later, during
# a production promotion. Anything that can reach either branch is tested first.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Promotion guard. Runs unconditionally so it always reports a status and can
  # therefore be a required check; it only *enforces* on PRs into main.
  #
  # Named `source-branch` because that is the context the main ruleset already
  # requires -- renaming it would leave main waiting forever on a check that no
  # longer exists.
  # ---------------------------------------------------------------------------
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch for main
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE" != "main" ]; then
            echo "Not a PR into main -- nothing to enforce."
            exit 0
          fi

          if [ "$HEAD" != "dev" ]; then
            echo "::error::PRs targeting main must originate from dev; got '$HEAD'."
            exit 1
          fi

          echo "Valid promotion: dev -> main."

  # ---------------------------------------------------------------------------
  # Backend: lint, format, types and tests.
  #
  # One job, not three. Each of the previous backend jobs paid for its own
  # checkout, Python install and `pip install -r requirements-dev.txt` to run a
  # few seconds of work. Sequential here is simpler and no slower in wall-clock,
  # and it fails on the first problem instead of reporting three variants of it.
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # .github/scripts/ and scripts/ are listed explicitly: pyproject's
      # `include` is ["backend*"], so the deploy-gate and post-deploy validation
      # scripts sit outside every configured lint path and would otherwise never
      # be checked -- which is how a stale literal in validate_production.py
      # reached production.
      - name: Ruff check
        run: ruff check backend/ .github/scripts/ scripts/

      - name: Ruff format check
        run: ruff format --check backend/ .github/scripts/ scripts/

      # mypy strict mode is configured in pyproject.toml to cover the
      # hardened core (a01-a05, a11, a12, exceptions, validators).
      - name: Mypy strict (hardened core)
        run: mypy

      # The deploy path runs these two with python3 and no pip install, so a
      # syntax error in either would only surface mid-deploy. Cheap to catch here.
      - name: Byte-compile the deploy-path scripts
        run: python3 -m py_compile .github/scripts/data_gate.py scripts/validate_production.py

      - name: Set up mock HMD data
        run: |
          mkdir -p backend/data/hmd/usa backend/data/hmd/spain
          cp backend/data/mock/hmd/usa/* backend/data/hmd/usa/
          cp backend/data/mock/hmd/spain/* backend/data/hmd/spain/

      # Inversion test for the production content gate. CI only ever has the
      # synthetic fixtures, so the correct outcome is that the gate REJECTS what
      # is on disk -- and rejects it for the right reason. If this step stops
      # finding the year-coverage complaint, the gate has stopped discriminating
      # and synthetic data could reach production again, which is the exact
      # failure this whole mechanism exists to prevent.
      - name: Assert the deploy data gate rejects synthetic fixtures
        run: |
          output=$(python3 .github/scripts/data_gate.py 2>&1 || true)
          echo "$output"
          if ! echo "$output" | grep -q "genuine HMD starts"; then
            echo "::error::data_gate.py did not reject the mock HMD fixtures on year coverage."
            exit 1
          fi
          echo "OK: the deploy gate still rejects synthetic HMD data."

      # Coverage is enforced on the hardened engine core; the rest is reported
      # but not gated, so progressive phases can raise the threshold.
      - name: Run unit + API tests with coverage
        run: |
          pytest backend/tests/ \
            --cov=backend/engine \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            --tb=short

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: lint, types, unit tests, build.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
