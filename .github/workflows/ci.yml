name: CI

on:
  push:
    branches: [main, 25julio, dev]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + type-check + tests + coverage
  # ---------------------------------------------------------------------------
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        # .github/scripts/ is included explicitly: pyproject's `include` is
        # ["backend*"], so the deploy-gate script sits outside every configured
        # lint path and would otherwise never be checked again.
        run: ruff check backend/ .github/scripts/

      - name: Ruff format check
        run: ruff format --check backend/ .github/scripts/

  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # mypy strict mode is configured in pyproject.toml to cover the
      # hardened core (a01-a05, a11, a12, exceptions, validators).
      - name: Mypy strict (hardened core)
        run: mypy

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Set up mock HMD data
        run: |
          mkdir -p backend/data/hmd/usa backend/data/hmd/spain
          cp backend/data/mock/hmd/usa/* backend/data/hmd/usa/
          cp backend/data/mock/hmd/spain/* backend/data/hmd/spain/

      # Inversion test for the production content gate. CI only ever has the
      # synthetic fixtures, so the correct outcome is that the gate REJECTS what
      # is on disk -- and rejects it for the right reason. If this step stops
      # finding the year-coverage complaint, the gate has stopped discriminating
      # and synthetic data could reach production again, which is the exact
      # failure this whole mechanism exists to prevent.
      - name: Assert the deploy data gate rejects synthetic fixtures
        run: |
          output=$(python3 .github/scripts/data_gate.py 2>&1 || true)
          echo "$output"
          if ! echo "$output" | grep -q "genuine HMD starts"; then
            echo "::error::data_gate.py did not reject the mock HMD fixtures on year coverage."
            exit 1
          fi
          echo "OK: the deploy gate still rejects synthetic HMD data."

      # Single test run with coverage. The previous workflow ran
      # `pytest backend/tests/test_api/` separately, which duplicated the
      # API tests (test_api/ is a subdir of backend/tests/). Coverage is
      # enforced on the hardened engine core; the rest is reported but not
      # gated, so progressive phases can raise the threshold.
      - name: Run unit + API tests with coverage
        run: |
          pytest backend/tests/ \
            --cov=backend/engine \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v --tb=short

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: lint + type-check + build
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
