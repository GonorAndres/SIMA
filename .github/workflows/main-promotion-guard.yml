name: Main promotion guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Bootstrap check on main."
            exit 0
          fi

          if [ "${HEAD_REF}" != "dev" ]; then
            echo "::error::PRs targeting main must originate from dev; got '${HEAD_REF}'."
            exit 1
          fi

          echo "Valid promotion: dev -> main."
