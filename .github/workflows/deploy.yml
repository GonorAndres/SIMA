name: Deploy

# One workflow for both environments, because they were 85% identical and the
# 15% that differed is exactly where the bugs hid: the candidate/validate/promote
# sequence existed only in the production file, so its first-ever execution was
# against production -- and it failed on a gcloud flag that `describe` does not
# accept.
#
# Now dev runs the identical path. Anything wrong with the deploy logic fails on
# dev, on a push, minutes after it is written.
#
#   push to dev            -> deploy to the dev environment
#   CI green on main       -> deploy to production
#   manual dispatch        -> pick the environment
on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, production]
        default: dev

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1

jobs:
  # ---------------------------------------------------------------------------
  # Resolve which environment this run targets, and gate on CI.
  #
  # A production run is only ever triggered by a *successful* CI run on main;
  # anything else is dev. Keeping that decision in one place means the deploy
  # job below never branches on the trigger.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      service: ${{ steps.resolve.outputs.service }}
      image: ${{ steps.resolve.outputs.image }}
      app_env: ${{ steps.resolve.outputs.app_env }}
      pages_branch: ${{ steps.resolve.outputs.pages_branch }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            ENVIRONMENT=production
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            ENVIRONMENT="${INPUT_ENV:-dev}"
          else
            ENVIRONMENT=dev
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            SERVICE=sima
            APP_ENV=production
            PAGES_BRANCH=main
          else
            SERVICE=sima-dev
            APP_ENV=development
            PAGES_BRANCH=dev
          fi

          SHA="${RUN_SHA:-$GIT_SHA}"

          {
            echo "environment=$ENVIRONMENT"
            echo "service=$SERVICE"
            echo "app_env=$APP_ENV"
            echo "pages_branch=$PAGES_BRANCH"
            echo "sha=$SHA"
            echo "image=${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sima/$SERVICE"
          } >> "$GITHUB_OUTPUT"

          echo "Deploying $ENVIRONMENT ($SERVICE) at $SHA"

  # ---------------------------------------------------------------------------
  # Backend. Identical for both environments, including the candidate/promote
  # sequence -- that is the whole point of merging the two workflows.
  # ---------------------------------------------------------------------------
  backend:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service_url: ${{ steps.urls.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451451662791/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-ad7a5be2-a1c7-4510-82d.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe sima \
            --location "${{ env.REGION }}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create sima \
            --repository-format docker \
            --location "${{ env.REGION }}" \
            --description "SIMA Cloud Run images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      # Dev pulls the same data as production, including HMD. Without it the
      # cross-country pages fall back silently and dev stops being a rehearsal.
      - name: Download real data from GCS
        run: |
          mkdir -p backend/data/inegi backend/data/conapo backend/data/hmd/usa backend/data/hmd/spain
          gsutil -m cp gs://sima-mortality-data/inegi/inegi_deaths.csv backend/data/inegi/
          gsutil -m cp gs://sima-mortality-data/conapo/conapo_population.csv backend/data/conapo/
          gsutil -m cp 'gs://sima-mortality-data/hmd/usa/*.txt' backend/data/hmd/usa/
          gsutil -m cp 'gs://sima-mortality-data/hmd/spain/*.txt' backend/data/hmd/spain/

      # Content gate. This used to be six `test -f` existence checks, which pass
      # on an empty or fabricated file -- precisely how synthetic HMD fixtures
      # reached production and were served as real actuarial results for months.
      # These checks assert properties of the world, not of the file format.
      # Stdlib only: no pip install in the deploy path.
      - name: Verify downloaded data is genuine
        run: python3 .github/scripts/data_gate.py

      - name: Build and push image
        run: |
          docker build -t "${{ needs.setup.outputs.image }}:${{ needs.setup.outputs.sha }}" .
          docker push "${{ needs.setup.outputs.image }}:${{ needs.setup.outputs.sha }}"

      # Deployed WITHOUT traffic, on the `candidate` tag only. The live revision
      # keeps serving until the validation below passes.
      #
      # Sizing: measured peak RSS (VmHWM) for the full 9-pipeline startup plus
      # one pass over every endpoint is ~142MB, so 512Mi is ~3.7x headroom.
      # --max-instances caps blast radius on a personal GCP account; Cloud Run
      # otherwise defaults to 100.
      - name: Deploy candidate revision (no traffic)
        run: |
          gcloud run deploy "${{ needs.setup.outputs.service }}" \
            --image "${{ needs.setup.outputs.image }}:${{ needs.setup.outputs.sha }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 3 \
            --no-traffic \
            --tag candidate \
            --update-env-vars "APP_ENV=${{ needs.setup.outputs.app_env }},CORS_ORIGINS=" \
            --set-secrets 'SIMA_PROXY_SECRET=sima-pages-proxy:latest'

      - name: Read candidate and live URLs
        id: urls
        run: |
          # Parsed from JSON rather than selected with `--filter`: that flag
          # belongs to `gcloud run services list`, and `describe` rejects it
          # ("unrecognized arguments: --filter"). An absent candidate tag yields
          # an empty string, which fails the guard below rather than cutting over
          # to something unverified.
          DESCRIBE=$(gcloud run services describe "${{ needs.setup.outputs.service }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format json)

          CANDIDATE_URL=$(printf '%s' "$DESCRIBE" | python3 -c "import json,sys; t=json.load(sys.stdin).get('status',{}).get('traffic',[]); print(next((e.get('url','') for e in t if e.get('tag')=='candidate'), ''))")
          SERVICE_URL=$(printf '%s' "$DESCRIBE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',{}).get('url',''))")

          if [ -z "$CANDIDATE_URL" ]; then
            echo "::error::No candidate-tagged URL on ${{ needs.setup.outputs.service }}; refusing to cut over."
            exit 1
          fi

          echo "Candidate: $CANDIDATE_URL"
          echo "Live:      $SERVICE_URL"
          {
            echo "candidate_url=$CANDIDATE_URL"
            echo "url=$SERVICE_URL"
          } >> "$GITHUB_OUTPUT"

      # The gate. Actuarial and API checks against the revision that is about to
      # take traffic. A non-zero exit here leaves the environment on its previous
      # revision.
      - name: Validate candidate before cutover
        env:
          SIMA_PROXY_SECRET: ${{ secrets.SIMA_PROXY_SECRET }}
        run: |
          # Warm it first: a --no-traffic tagged revision can be scaled to zero
          # between steps, and a cold start runs all nine mortality pipelines --
          # slower than validate_production.py's bare 60s timeout, which has no
          # retries of its own.
          curl --fail --retry 10 --retry-delay 6 \
            -H "X-SIMA-Proxy-Secret: ${SIMA_PROXY_SECRET}" \
            "${{ steps.urls.outputs.candidate_url }}/api/health"

          python3 scripts/validate_production.py "${{ steps.urls.outputs.candidate_url }}"

      - name: Promote candidate to 100% traffic
        run: |
          gcloud run services update-traffic "${{ needs.setup.outputs.service }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --to-latest

  # ---------------------------------------------------------------------------
  # Frontend. `--branch` decides production vs preview on Cloudflare Pages.
  # ---------------------------------------------------------------------------
  frontend:
    needs: [setup, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name sima \
            --branch "${{ needs.setup.outputs.pages_branch }}"

      # Confirmation, not the gate -- the gate ran against the candidate before
      # any traffic moved. This re-runs the checks against the live URL to catch
      # anything specific to the promoted routing.
      - name: Re-validate live backend
        env:
          SIMA_PROXY_SECRET: ${{ secrets.SIMA_PROXY_SECRET }}
        run: python3 scripts/validate_production.py "${{ needs.backend.outputs.service_url }}"

  # ---------------------------------------------------------------------------
  # Keep dev pointed at what production is actually running, so the next
  # promotion PR contains only genuinely new work.
  # ---------------------------------------------------------------------------
  sync-dev:
    if: needs.setup.outputs.environment == 'production'
    needs: [setup, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEV_SYNC_DEPLOY_KEY }}

      - name: Verify ancestry and fast-forward dev
        run: |
          git fetch origin dev:refs/remotes/origin/dev

          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo "::error::Refusing to update dev: it is not an ancestor of deployed main."
            exit 1
          fi

          git push origin HEAD:dev
