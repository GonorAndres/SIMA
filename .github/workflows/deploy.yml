name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: sima
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sima/sima
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      service_url: ${{ steps.service.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451451662791/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-ad7a5be2-a1c7-4510-82d.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe sima \
            --location "${{ env.REGION }}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create sima \
            --repository-format docker \
            --location "${{ env.REGION }}" \
            --description "SIMA Cloud Run images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Download real data from GCS
        run: |
          mkdir -p backend/data/inegi backend/data/conapo backend/data/hmd/usa backend/data/hmd/spain
          gsutil -m cp gs://sima-mortality-data/inegi/inegi_deaths.csv backend/data/inegi/
          gsutil -m cp gs://sima-mortality-data/conapo/conapo_population.csv backend/data/conapo/
          gsutil -m cp gs://sima-mortality-data/hmd/usa/*.txt backend/data/hmd/usa/
          gsutil -m cp gs://sima-mortality-data/hmd/spain/*.txt backend/data/hmd/spain/

      # Content gate. This step used to be six `test -f` existence checks, which
      # pass on an empty or fabricated file -- that is precisely how synthetic HMD
      # fixtures reached production and were served as real actuarial results for
      # months. The checks below assert properties of the world, not of the file
      # format, so a generator cannot satisfy them without reimplementing
      # demography. Stdlib only: no pip install in the deploy path.
      - name: Verify downloaded data is genuine
        run: python3 .github/scripts/data_gate.py

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }} .
          docker push ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}

      # Deploy WITHOUT traffic. The new revision goes live only on the `candidate`
      # tag, reachable at its own URL; production keeps serving the previous
      # revision until the validation step below passes. Previously the 22 checks
      # in validate_production.py ran after 100% of traffic had already cut over,
      # so they could only tell us we had already broken the site.
      #
      # Sizing: measured peak RSS (VmHWM) for the full 9-pipeline startup load
      # plus one pass over every endpoint is ~142MB, so 512Mi is about 3.7x
      # headroom. --max-instances caps blast radius on a personal GCP account;
      # without it Cloud Run defaults to 100 instances.
      - name: Deploy candidate revision (no traffic)
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 3 \
            --no-traffic \
            --tag candidate \
            --update-env-vars 'APP_ENV=production,CORS_ORIGINS=' \
            --set-secrets 'SIMA_PROXY_SECRET=sima-pages-proxy:latest'

      - name: Read candidate and production URLs
        id: service
        run: |
          # Reads the URL of the entry tagged `candidate` -- `--tag` on
          # `run deploy` moves that tag onto the revision just pushed.
          #
          # Parsed from JSON rather than selected with `--filter`: that flag
          # belongs to `gcloud run services list`, and `describe` rejects it
          # outright ("unrecognized arguments: --filter"). The whole step
          # therefore failed the first time it ran, and the cutover was
          # correctly refused rather than performed blind.
          CANDIDATE_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format json \
            | python3 -c "import json,sys; t=json.load(sys.stdin).get('status',{}).get('traffic',[]); print(next((e.get('url','') for e in t if e.get('tag')=='candidate'), ''))")

          if [ -z "$CANDIDATE_URL" ]; then
            echo "::error::No candidate-tagged URL on ${{ env.SERVICE }}; refusing to cut over."
            exit 1
          fi

          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')

          echo "Candidate URL: $CANDIDATE_URL"
          echo "Service URL:   $SERVICE_URL"
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      # The gate. 22 actuarial and API checks against the revision that is about
      # to take traffic. Non-zero exit here leaves production on the old revision.
      - name: Validate candidate revision before cutover
        env:
          SIMA_PROXY_SECRET: ${{ secrets.SIMA_PROXY_SECRET }}
        run: |
          # Warm the candidate first, exactly as deploy-dev.yml does. A
          # --no-traffic tagged revision can be scaled to zero between the
          # deploy step and this one, and validate_production.py uses a bare
          # 60s urllib timeout with no retries -- so without this, a cold start
          # fails a perfectly good production deploy while dev is protected.
          curl --fail --retry 10 --retry-delay 6 \
            -H "X-SIMA-Proxy-Secret: ${SIMA_PROXY_SECRET}" \
            "${{ steps.service.outputs.candidate_url }}/api/health"

          python3 scripts/validate_production.py "${{ steps.service.outputs.candidate_url }}"

      - name: Promote candidate to 100% traffic
        run: |
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --to-latest

  frontend:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy production to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name sima --branch main

      # Confirmation, not the gate -- the gate ran against the candidate revision
      # before any traffic moved. This re-runs the same checks against the live
      # URL to catch anything specific to the promoted routing.
      - name: Re-validate live production backend
        env:
          SIMA_PROXY_SECRET: ${{ secrets.SIMA_PROXY_SECRET }}
        run: python3 scripts/validate_production.py "${{ needs.deploy.outputs.service_url }}"

  sync-dev:
    name: Fast-forward dev to deployed main
    needs: [deploy, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEV_SYNC_DEPLOY_KEY }}

      - name: Verify ancestry and fast-forward dev
        run: |
          git fetch origin dev:refs/remotes/origin/dev

          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo "::error::Refusing to update dev: it is not an ancestor of deployed main."
            exit 1
          fi

          git push origin HEAD:dev
