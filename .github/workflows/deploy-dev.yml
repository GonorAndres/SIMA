name: Deploy development

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GCP_SERVICE: sima-dev
  GCP_IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sima/sima-dev
  PAGES_PROJECT: sima

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service_url: ${{ steps.service.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451451662791/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-ad7a5be2-a1c7-4510-82d.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Dev pulls the same data as production, including HMD. Without it the
      # cross-country pages fall back silently, so dev stops being a useful
      # rehearsal of the production deploy.
      - name: Download production-equivalent actuarial data
        run: |
          mkdir -p backend/data/inegi backend/data/conapo backend/data/hmd/usa backend/data/hmd/spain
          gsutil cp gs://sima-mortality-data/inegi/inegi_deaths.csv backend/data/inegi/
          gsutil cp gs://sima-mortality-data/conapo/conapo_population.csv backend/data/conapo/
          gsutil -m cp 'gs://sima-mortality-data/hmd/usa/*.txt' backend/data/hmd/usa/
          gsutil -m cp 'gs://sima-mortality-data/hmd/spain/*.txt' backend/data/hmd/spain/

      # Same content gate as production: existence checks pass on fabricated
      # files, so assert properties of the world instead. See the module docstring
      # in .github/scripts/data_gate.py for why this exists.
      - name: Verify downloaded data is genuine
        run: python3 .github/scripts/data_gate.py

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push backend
        run: |
          docker build -t "${GCP_IMAGE}:${GITHUB_SHA}" .
          docker push "${GCP_IMAGE}:${GITHUB_SHA}"

      # Sizing matches production: measured peak RSS (VmHWM) for the full
      # 9-pipeline startup load plus one pass over every endpoint is ~142MB, so
      # 512Mi leaves about 3.7x headroom, and --max-instances caps the blast
      # radius (Cloud Run otherwise defaults to 100 instances).
      # Dev is a preview environment, so it takes traffic immediately -- the
      # candidate/promote dance is production-only.
      - name: Deploy backend
        run: |
          gcloud run deploy "${GCP_SERVICE}" \
            --image "${GCP_IMAGE}:${GITHUB_SHA}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 3 \
            --update-env-vars 'APP_ENV=development,CORS_ORIGINS=' \
            --set-secrets 'SIMA_PROXY_SECRET=sima-pages-proxy:latest'

      - id: service
        name: Read backend URL
        run: |
          url="$(gcloud run services describe "${GCP_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format 'value(status.url)')"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

  frontend:
    needs: backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy dev preview to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name "${PAGES_PROJECT}" --branch dev

      - name: Verify protected dev backend
        env:
          SIMA_PROXY_SECRET: ${{ secrets.SIMA_PROXY_SECRET }}
        run: |
          # Warm the container first: a cold start runs all nine mortality
          # pipelines, which is slower than validate_production.py's timeout.
          curl --fail --retry 10 --retry-delay 6 \
            -H "X-SIMA-Proxy-Secret: ${SIMA_PROXY_SECRET}" \
            "${{ needs.backend.outputs.service_url }}/api/health"

          # Then run the same actuarial checks production uses, so a broken
          # result surfaces on dev instead of on the public site.
          python3 scripts/validate_production.py "${{ needs.backend.outputs.service_url }}"
